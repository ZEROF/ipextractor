name: Update IP Lists

on:
  schedule:
    # Runs every 4 hours, at minute 17, in UTC
    - cron: '17 */4 * * *'

  workflow_dispatch:

concurrency:
  group: update-ip-lists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update single URL list
        run: |
          python3 ipexdbl_simple.py
          echo "ipexdbl_simple finished"

      - name: Update multiple URL list
        run: |
          python3 ipexdbl.py
          echo "ipexdbl finished"

      - name: Upload IP lists backup
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ip-lists-backup-${{ github.run_id }}
          path: |
            ipexdbl_simple.txt
            ipexdbl.txt
          retention-days: 3
          if-no-files-found: warn

      - name: Commit updated lists
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update IP lists
          file_pattern: 'ipexdbl_simple.txt ipexdbl.txt'
